name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package-lock.json yet (v0.1 was written without npm access): switch to `npm ci` once it's committed.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Temporary (issue #1): commit the generated lockfile back to this branch.
      - if: github.event_name == 'pull_request' && github.head_ref == 'issue-1-lockfile'
        run: |
          git config user.name "brankingsleychembah"
          git config user.email "brankingsleychembah@gmail.com"
          git fetch origin issue-1-lockfile
          git checkout issue-1-lockfile
          git add package-lock.json
          git commit -m "Add package-lock.json (generated by CI, #1)" && git push origin issue-1-lockfile || echo "nothing to commit"
